{% extends "base.html" %}
{% block content %}
<h1>Password</h1>
<p class="lede">Change the password for {{ user.username }}. This updates only the account you are signed in with.</p>
<section class="panel">
  <form method="post" action="/account/password" class="grid">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="wide">Current password
      <input name="current_password" type="password" required autocomplete="current-password">
    </label>
    <label>New password
      <input name="new_password" type="password" required autocomplete="new-password">
    </label>
    <label>Confirm new password
      <input name="confirm_password" type="password" required autocomplete="new-password">
    </label>
    <div class="actions"><button type="submit">Change password</button></div>
  </form>
</section>
{% endblock %}
